<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#F7F8FA; --surface:#FFFFFF; --ink:#111418; --muted:#5B6470; --faint:#8A93A0;
      --line:#E6E8EC; --accent:#2563EB; --accent-press:#1D4ED8; --accent-wash:rgba(37,99,235,.09);
      --good-bg:#E7F5EC; --good-ink:#0F7B4A; --danger:#B4231F;
      --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.05);
      --font:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:var(--accent-press);}
    .app{min-height:100%;background:var(--bg);display:flex;flex-direction:column;}
    .topbar{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface);}
    .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
    .brand .blk{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;}
    .brand .blk svg{width:15px;height:15px;}
    .tnav{display:flex;align-items:center;gap:16px;}
    .tnav a{font-size:13px;color:var(--muted);}
    .tgl{display:flex;padding:3px;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;}
    .tgl span{width:26px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:var(--faint);}
    .tgl span svg{width:14px;height:14px;}
    .tgl .on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);}
    .toolhead{padding:20px 28px 14px;display:flex;flex-direction:column;gap:3px;}
    .back{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
    .toolhead h1{margin:3px 0 0;font-size:21px;font-weight:700;letter-spacing:-.015em;}
    .toolhead .sub{font-size:13px;color:var(--muted);}
    .otoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);}
    .ocount{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
    .ocount b{color:var(--ink);font-weight:600;}
    .tgroup{display:flex;align-items:center;gap:6px;}
    .tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;}
    .tbtn.danger{color:var(--danger);}
    .tbtn svg{width:14px;height:14px;}
    .tsep{width:1px;height:20px;background:var(--line);}
    .zoom{display:flex;align-items:center;gap:8px;color:var(--faint);}
    .zoom .zt{width:64px;height:4px;border-radius:999px;background:var(--line);position:relative;}
    .zoom .zt::after{content:"";position:absolute;left:58%;top:50%;width:12px;height:12px;border-radius:999px;background:#fff;border:1px solid var(--line);transform:translate(-50%,-50%);}
    .pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:22px 28px;align-items:center;}
    .pg{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;height:170px;box-shadow:var(--shadow);overflow:hidden;}
    .pgc{position:absolute;inset:0;padding:16px 13px 26px;display:flex;flex-direction:column;gap:7px;}
    .pgc i{height:3px;border-radius:2px;background:var(--line);}
    .pgn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums;}
    .pg.sel{outline:2px solid var(--accent);outline-offset:-1px;}
    .pg.sel .pgn{color:#fff;background:var(--accent);border-color:var(--accent);}
    .pg.rot .pgc{transform:rotate(90deg) scale(.74);transform-origin:center;}
    .rotmark{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:5px;background:var(--accent-wash);color:var(--accent);display:flex;align-items:center;justify-content:center;}
    .rotmark svg{width:12px;height:12px;}
    .pg.lift{transform:rotate(-3deg) scale(1.04);box-shadow:0 14px 30px rgba(16,24,40,.20);opacity:.97;z-index:2;border-color:var(--accent);}
    .dropline{width:3px;background:var(--accent);border-radius:2px;justify-self:center;height:150px;position:relative;}
    .dropline::before,.dropline::after{content:"";position:absolute;left:50%;width:9px;height:9px;background:var(--accent);border-radius:999px;transform:translateX(-50%);}
    .dropline::before{top:-5px;} .dropline::after{bottom:-5px;}
    .ov{position:absolute;inset:0;z-index:3;background:rgba(17,20,24,.42);display:flex;align-items:center;justify-content:center;gap:7px;}
    .ov button{width:30px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.96);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .ov button svg{width:15px;height:15px;}
    .ov button.del{color:var(--danger);}
    .stickybar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 28px;border-top:1px solid var(--line);background:var(--surface);}
    .badge{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--good-bg);color:var(--good-ink);font-size:11.5px;font-weight:500;}
    .badge .dot{flex:none;width:6px;height:6px;border-radius:999px;background:currentColor;}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;border:1px solid transparent;}
    .btn.primary{background:var(--accent);color:#fff;}
    .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
    .bar-r{display:flex;gap:8px;}
  </style>
</helmet>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="blk"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="9" width="11" height="8" rx="1.6"></rect><path d="M7 9V6.6a3 3 0 0 1 6 0V9"></path></svg></span>
      Secure Doc Converter
    </div>
    <div class="tnav">
      <a href="#">About &amp; privacy</a>
      <div class="tgl">
        <span class="on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.2"></circle><path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4"></path></svg></span>
        <span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6 11.6A6 6 0 1 1 8.4 4.4a4.7 4.7 0 0 0 7.2 7.2Z"></path></svg></span>
      </div>
    </div>
  </header>

  <div class="toolhead">
    <span class="back"><svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5l-5 5 5 5"></path></svg> All tools</span>
    <h1>Organize pages</h1>
    <span class="sub">Reorder, rotate or remove pages. Drag a page, or select one and press Alt + &uarr; / &darr;.</span>
  </div>

  <div class="otoolbar">
    <span class="ocount"><b>14 pages</b> &middot; 2 selected</span>
    <div class="tgroup">
      <button class="tbtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8A6 6 0 1 1 4 11M4.5 4.2v4h4"></path></svg> Rotate left</button>
      <button class="tbtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 8A6 6 0 1 0 16 11M15.5 4.2v4h-4"></path></svg> Rotate right</button>
      <button class="tbtn danger"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.8 9.5a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9L14 6"></path></svg> Delete</button>
      <span class="tsep"></span>
      <button class="tbtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="11" height="13" rx="1.6"></rect><path d="M10 7v6M7 10h6"></path></svg> Insert from PDF&hellip;</button>
      <span class="tsep"></span>
      <span class="zoom"><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10h10"></path></svg><span class="zt"></span><svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 5v10M5 10h10"></path></svg></span>
    </div>
  </div>

  <div class="pgrid">
    <div class="pg"><div class="pgc"><i style="width:100%"></i><i style="width:88%"></i><i style="width:96%"></i><i style="width:55%"></i></div><span class="pgn">1</span></div>
    <div class="pg sel"><div class="pgc"><i style="width:100%"></i><i style="width:92%"></i><i style="width:80%"></i><i style="width:60%"></i></div><span class="pgn">2</span></div>
    <div class="dropline"></div>
    <div class="pg lift"><div class="pgc"><i style="width:100%"></i><i style="width:70%"></i><i style="width:94%"></i><i style="width:50%"></i></div><span class="pgn">3</span></div>
    <div class="pg"><div class="pgc"><i style="width:90%"></i><i style="width:100%"></i><i style="width:76%"></i><i style="width:64%"></i></div><span class="pgn">4</span></div>

    <div class="pg rot"><div class="pgc"><i style="width:100%"></i><i style="width:85%"></i><i style="width:92%"></i><i style="width:58%"></i></div><span class="rotmark"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 8A6 6 0 1 0 16 11M15.5 4.2v4h-4"></path></svg></span><span class="pgn">5</span></div>
    <div class="pg"><div class="pgc"><i style="width:96%"></i><i style="width:100%"></i><i style="width:70%"></i><i style="width:62%"></i></div><span class="pgn">6</span></div>
    <div class="pg"><div class="pgc"><i style="width:100%"></i><i style="width:80%"></i><i style="width:88%"></i><i style="width:48%"></i></div><span class="pgn">7</span></div>
    <div class="pg"><div class="ov"><button><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8A6 6 0 1 1 4 11M4.5 4.2v4h4"></path></svg></button><button><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 8A6 6 0 1 0 16 11M15.5 4.2v4h-4"></path></svg></button><button class="del"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.8 9.5a1 1 0 0 0 1 .9h4.4a1 1 0 0 0 1-.9L14 6"></path></svg></button></div><div class="pgc"><i style="width:100%"></i><i style="width:90%"></i><i style="width:82%"></i><i style="width:56%"></i></div><span class="pgn">8</span></div>
    <div class="pg sel"><div class="pgc"><i style="width:100%"></i><i style="width:74%"></i><i style="width:98%"></i><i style="width:52%"></i></div><span class="pgn">9</span></div>

    <div class="pg"><div class="pgc"><i style="width:88%"></i><i style="width:100%"></i><i style="width:72%"></i><i style="width:60%"></i></div><span class="pgn">10</span></div>
    <div class="pg"><div class="pgc"><i style="width:100%"></i><i style="width:84%"></i><i style="width:90%"></i><i style="width:46%"></i></div><span class="pgn">11</span></div>
    <div class="pg"><div class="pgc"><i style="width:94%"></i><i style="width:100%"></i><i style="width:78%"></i><i style="width:64%"></i></div><span class="pgn">12</span></div>
    <div class="pg"><div class="pgc"><i style="width:100%"></i><i style="width:79%"></i><i style="width:86%"></i><i style="width:50%"></i></div><span class="pgn">13</span></div>
    <div class="pg"><div class="pgc"><i style="width:90%"></i><i style="width:100%"></i><i style="width:74%"></i><i style="width:58%"></i></div><span class="pgn">14</span></div>
  </div>

  <div class="stickybar">
    <span class="badge"><span class="dot"></span> Every change happens in your browser &mdash; nothing is uploaded.</span>
    <span class="bar-r"><button class="btn ghost">Reset</button><button class="btn primary">Download PDF</button></span>
  </div>
</div>
</x-dc>
</body>
</html>
