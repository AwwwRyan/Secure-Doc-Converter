name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No third-party origins in build
        run: |
          # The app must talk only to its own origin (docs/05, CLAUDE.md).
          if grep -rIEo "https?://[a-zA-Z0-9.-]+" dist/assets \
             | grep -vE "https?://(www\.)?(w3\.org|localhost)" ; then
            echo "::error::found an external origin referenced in the build"
            exit 1
          fi
