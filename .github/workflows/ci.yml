name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vendored engine checksums
        run: |
          (cd public/vendor/tesseract && sha256sum -c SHA256SUMS)
          (cd public/vendor/qpdf && sha256sum -c SHA256SUMS)

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No third-party origins in build
        # The app must talk only to its own origin (docs/05, CLAUDE.md). The
        # script allow-lists inert URL strings baked into vendored libraries
        # (namespace URIs, license banners, dead config) and fails on anything
        # else.
        run: pnpm check:origins
